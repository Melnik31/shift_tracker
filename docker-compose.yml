services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: shifttracker
      POSTGRES_PASSWORD: shifttracker
      POSTGRES_DB: shifttracker_dev
    ports:
      - '5432:5432'
    volumes:
      - shifttracker_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shifttracker -d shifttracker_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shifttracker_postgres_data:
