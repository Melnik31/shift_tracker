name: Test, migrate, and deploy

# Single production stack — no staging environment for now (pre-launch,
# no real users/data yet; see DEPLOYING.md). Every secret below is read
# from the "production" GitHub Environment.
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shifttracker
          POSTGRES_PASSWORD: shifttracker
          POSTGRES_DB: shifttracker_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shifttracker -d shifttracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npx tsc --noEmit
        working-directory: server
      - run: npm test
        working-directory: server
        env:
          # The test suite's own vitest.config.ts points at this same
          # localhost:5432/shifttracker_test — matches the service container
          # above exactly, so no override needed here beyond what's already
          # hardcoded there for local dev. Supabase Storage tests (Step 4)
          # do need real credentials though, since they're not mocked — this
          # means CI test runs touch the same bucket production uses, with
          # small throwaway files each test already cleans up after itself.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: shift-attachments
      - run: npm ci
        working-directory: client
      - run: npx tsc --noEmit
        working-directory: client

  migrate-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server

      # Applies only already-committed migration files (server/prisma/migrations) —
      # never generates one, never prompts. Safe to run unattended. Uses
      # DIRECT_URL (non-pooled) since migrations need a real connection,
      # not PgBouncer — see DEPLOYING.md.
      - name: Run database migrations
        run: npx prisma migrate deploy
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # Deploying explicitly here (rather than relying on Render's own
      # "auto-deploy on push") guarantees the migration above always
      # finishes first — turn off Render's native auto-deploy for this repo
      # so the two mechanisms don't race. The deploy hook just tells Render
      # to pull and redeploy the latest commit on the connected branch — no
      # CLI/token needed, just this one URL, generated under the service's
      # Settings → Deploy Hook.
      #
      # Vercel is deliberately NOT deployed from here — it's just a static
      # build with no schema/migration dependency to sequence against, so
      # its own native GitHub integration (auto-deploy on push) is simpler
      # and just as safe. Leave Vercel's auto-deploy ON.
      - name: Deploy API to Render
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
